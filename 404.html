<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Page not found — Hugh Koeze</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Josefin+Sans:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .not-found {
      min-height: calc(100vh - 89px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6) var(--space-3);
      text-align: center;
    }
    .not-found-code {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: var(--brick);
      margin-bottom: var(--space-2);
    }
    .not-found h1 {
      font-size: 1.75rem;
      color: var(--oak);
      margin-bottom: var(--space-2);
    }
    .not-found p {
      color: var(--charcoal-light);
      margin: 0 auto var(--space-4);
    }
    .not-found .divider-square {
      width: 200px;
      margin: 0 auto var(--space-4);
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <nav>
        <a href="/" class="site-title">Hugh Koeze</a>
        <ul>
          <li><a href="/teaching.html">Teaching</a></li>
          <li><a href="/writing.html">Writing</a></li>
          <li><a href="/photography.html">Photography</a></li>
          <li><a href="/about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="not-found">
    <div>
      <div class="not-found-code">404</div>
      <h1>Page not found</h1>
      <div class="divider-square"><i></i></div>
      <p>That page has moved, or it never existed. Try one of the sections above.</p>
      <a href="/" class="btn btn-secondary">Back home</a>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      <p class="footer-subtle"><a href="https://hughkoeze.substack.com/p/its-still-not-easy-to-code">Wondering how an English teacher made this website?</a></p>
    </div>
  </footer>

</body>
</html>
